<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="squadar-logo-title">
  <title id="squadar-logo-title">Squadar</title>
  <!-- Radar grid: outer hexagon -->
  <polygon points="32,6 54.5,19 54.5,45 32,58 9.5,45 9.5,19"
           fill="none" stroke="#1F3A5F" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Radar grid: inner ring -->
  <polygon points="32,19 43.2,25.5 43.2,38.5 32,45 20.8,38.5 20.8,25.5"
           fill="none" stroke="#1F3A5F" stroke-width="1.25" stroke-linejoin="round" opacity="0.35"/>
  <!-- Plotted skill profile -->
  <polygon points="32,11 50,21.5 45,42 32,50 15,38 15,23"
           fill="#0F6F6C" fill-opacity="0.22" stroke="#0F6F6C" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Vertices of the profile -->
  <circle cx="32" cy="11" r="2.6" fill="#0F6F6C"/>
  <circle cx="50" cy="21.5" r="2.6" fill="#0F6F6C"/>
  <circle cx="45" cy="42" r="2.6" fill="#0F6F6C"/>
  <circle cx="32" cy="50" r="2.6" fill="#0F6F6C"/>
  <circle cx="15" cy="38" r="2.6" fill="#0F6F6C"/>
  <circle cx="15" cy="23" r="2.6" fill="#0F6F6C"/>
  <!-- Center -->
  <circle cx="32" cy="32" r="2" fill="#1F3A5F"/>
</svg>
